name: Project - Mark Done on PR merged to development

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  done:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest
    env:
      ORG: Maximus-Technologies-Uganda
      PROJECT_NUMBER: 4
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Ensure token present
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN is not set. Add a repo secret GH_TOKEN with org Projects (v2) write access." >&2
            exit 1
          fi

      - name: Resolve Project and Status:Done option
        id: proj
        run: |
          Q='query($org:String!,$num:Int!){organization(login:$org){projectV2(number:$num){id fields(first:50){nodes{__typename id name ... on ProjectV2SingleSelectField { options { id name } }}}}}}'
          RESP=$(gh api graphql -f query="$Q" -F org="$ORG" -F num="$PROJECT_NUMBER")
          echo "$RESP" > proj.json
          echo "project_id=$(jq -r .data.organization.projectV2.id proj.json)" >> $GITHUB_OUTPUT
          echo "status_field_id=$(jq -r '.data.organization.projectV2.fields.nodes[] | select(.name=="Status") | .id' proj.json)" >> $GITHUB_OUTPUT
          echo "done_option_id=$(jq -r '.data.organization.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="Done") | .id' proj.json)" >> $GITHUB_OUTPUT

      - name: Find issues closed by merged PR
        id: issues
        run: |
          OWNER='${{ github.repository_owner }}'
          REPO='${{ github.event.repository.name }}'
          NUM='${{ github.event.pull_request.number }}'
          Q='query($owner:String!,$repo:String!,$num:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$num){closingIssuesReferences(first:50){nodes{number}}}}}'
          RESP=$(gh api graphql -f query="$Q" -F owner="$OWNER" -F repo="$REPO" -F num="$NUM")
          echo "$RESP" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' > issues.txt || true
          echo "count=$(wc -l < issues.txt)" >> $GITHUB_OUTPUT

      - name: Fallback - derive issues from branch/title/body/T-codes
        if: steps.issues.outputs.count == '0'
        run: |
          OWNER='${{ github.repository_owner }}'
          REPO='${{ github.event.repository.name }}'
          BRANCH='${{ github.event.pull_request.head.ref }}'
          TITLE='${{ github.event.pull_request.title }}'
          BODY='${{ github.event.pull_request.body }}'

          : > issues_fallback.txt

          # 1) From branch name feature/gh-123-scope
          echo "$BRANCH" | sed -n 's/.*[gG][hH]-\([0-9][0-9]*\).*/\1/p' >> issues_fallback.txt || true

          # 2) From Title/Body explicit #123 references
          printf "%s\n%s\n" "$TITLE" "$BODY" | grep -oE '#[0-9]+' | tr -d '#' >> issues_fallback.txt || true

          # 3) From T-codes in Title/Body (e.g., T001) → map by title prefix in repo issues
          T_CODES=$(printf "%s\n%s\n" "$TITLE" "$BODY" | grep -oE 'T[0-9]{3}' | sort -u || true)
          if [ -n "$T_CODES" ]; then
            gh issue list -R "$OWNER/$REPO" --state all --limit 500 --json number,title > all_issues.json
            for code in $T_CODES; do
              jq -r --arg c "$code " '.[] | select(.title | startswith($c)) | .number' all_issues.json >> issues_fallback.txt
            done
          fi

          # Deduplicate and keep only numbers
          if [ -s issues_fallback.txt ]; then
            sed -n 's/^[[:space:]]*\\([0-9][0-9]*\\)[[:space:]]*$/\\1/p' issues_fallback.txt | sort -u > issues_fallback.txt.tmp || true
            mv issues_fallback.txt.tmp issues_fallback.txt
          fi

      - name: Prepare final issues list
        run: |
          { cat issues.txt 2>/dev/null; cat issues_fallback.txt 2>/dev/null; } | sed '/^$/d' | sort -u > issues_final.txt || true
          echo "Final issues candidates:"
          cat issues_final.txt || true

      - name: No closing issues found — fallback notice
        if: steps.issues.outputs.count == '0'
        run: |
          echo "No closing issues were detected for this PR. To auto-move items to Done, include closing keywords like 'Closes #123' in the PR body." >&2
          gh pr comment '${{ github.event.pull_request.number }}' \
            --repo '${{ github.repository }}' \
            --body "Heads up: No closing issues were detected for this PR. To auto-move linked Project items to Done, include closing keywords like 'Closes #148' in the PR description."

      - name: Set Status to Done on linked issue items
        if: always()
        run: |
          if [ ! -s issues_final.txt ]; then
            echo "No issues found to mark Done (final list empty)." >&2
            exit 0
          fi
          OWNER='${{ github.repository_owner }}'
          REPO='${{ github.event.repository.name }}'
          GH_FAILURE=0
          while read N; do
            [ -z "$N" ] && continue
            Q='query($owner:String!,$repo:String!,$num:Int!){repository(owner:$owner,name:$repo){issue(number:$num){projectItems(first:50){nodes{id project{number}}}}}}'
            if ! R=$(gh api graphql -f query="$Q" -F owner="$OWNER" -F repo="$REPO" -F num="$N"); then
              echo "Skipping issue #$N: unable to query project items (check GH_TOKEN permissions)." >&2
              GH_FAILURE=1
              continue
            fi
            echo "$R" | jq -r --arg pn "${PROJECT_NUMBER}" '.data.repository.issue.projectItems.nodes[] | select(.project.number == ($pn|tonumber)) | .id' > project_items.txt
            if [ ! -s project_items.txt ]; then
              continue
            fi
            while read ITEM; do
              [ -z "$ITEM" ] && continue
              MID='mutation($project:ID!,$item:ID!,$field:ID!,$opt:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$opt}}){clientMutationId}}'
              if ! gh api graphql -f query="$MID" \
                -F project='${{ steps.proj.outputs.project_id }}' \
                -F item="$ITEM" \
                -F field='${{ steps.proj.outputs.status_field_id }}' \
                -F opt='${{ steps.proj.outputs.done_option_id }}'; then
                echo "Failed to update project item $ITEM for issue #$N (check GH_TOKEN permissions)." >&2
                GH_FAILURE=1
              fi
            done < project_items.txt
          done < issues_final.txt
          rm -f project_items.txt
          if [ "$GH_FAILURE" -eq 1 ]; then
            echo "One or more GitHub API requests failed. Project automation has been partially skipped." >&2
          fi
          exit 0



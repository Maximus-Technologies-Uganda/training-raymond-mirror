name: Project - Mark PR review status on linked issues

on:
  pull_request:
    types: [opened, ready_for_review, reopened, review_requested]

permissions:
  contents: read

jobs:
  in-review:
    runs-on: ubuntu-latest
    env:
      ORG: Maximus-Technologies-Uganda
      PROJECT_NUMBER: 4
      STATUS_NAME: PR Review
    steps:
      - name: Configure gh authentication
        run: |
          if [ -n "${{ secrets.GH_TOKEN }}" ]; then
            echo "Using GH_TOKEN secret for gh CLI."
            echo "GH_TOKEN=${{ secrets.GH_TOKEN }}" >> "$GITHUB_ENV"
            echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" >> "$GITHUB_ENV"
          else
            echo "Warning: GH_TOKEN secret not set. Falling back to the default GITHUB_TOKEN which may lack Projects v2 access." >&2
            echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
            echo "GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
          fi

      - name: Resolve Project and Status option
        id: proj
        run: |
          set -eo pipefail

          STATUS_FIELD_LABEL='Status'
          Q='query($org:String!,$num:Int!,$fieldName:String!){organization(login:$org){projectV2(number:$num){id statusField:field(name:$fieldName){... on ProjectV2SingleSelectField { id name options { id name } }}}}}'
          if ! gh api graphql -f query="$Q" -F org="$ORG" -F num="$PROJECT_NUMBER" -F fieldName="$STATUS_FIELD_LABEL" > proj.json; then
            echo "Project ${PROJECT_NUMBER} in org ${ORG} is not accessible. Skipping project status update." >&2
            echo "project_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_ID=$(jq -r '.data.organization.projectV2.id // empty' proj.json)

          if [ -z "$PROJECT_ID" ]; then
            echo "Project ${PROJECT_NUMBER} in org ${ORG} was not found. Skipping project status update." >&2
            cat proj.json >&2
            echo "project_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS_FIELD_ID=$(jq -r '.data.organization.projectV2.statusField.id' proj.json)
          STATUS_OPTION_ID=$(jq -r --arg n "$STATUS_NAME" '.data.organization.projectV2.statusField.options[] | select(.name==$n) | .id' proj.json)

          if [ -z "$STATUS_FIELD_ID" ] || [ "$STATUS_FIELD_ID" = "null" ]; then
            echo "Failed to locate '$STATUS_FIELD_LABEL' field for project ${PROJECT_NUMBER}." >&2
            cat proj.json >&2
            exit 1
          fi

          if [ -z "$STATUS_OPTION_ID" ] || [ "$STATUS_OPTION_ID" = "null" ]; then
            echo "Failed to locate status option '$STATUS_NAME' in '$STATUS_FIELD_LABEL' field." >&2
            cat proj.json >&2
            exit 1
          fi

          {
            echo "project_found=true"
            echo "project_id=$PROJECT_ID"
            echo "status_field_id=$STATUS_FIELD_ID"
            echo "status_option_id=$STATUS_OPTION_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Find issues closed by this PR
        id: issues
        run: |
          OWNER='${{ github.repository_owner }}'
          REPO='${{ github.event.repository.name }}'
          NUM='${{ github.event.pull_request.number }}'
          Q='query($owner:String!,$repo:String!,$num:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$num){closingIssuesReferences(first:50){nodes{number}}}}}'
          RESP=$(gh api graphql -f query="$Q" -F owner="$OWNER" -F repo="$REPO" -F num="$NUM")
          echo "$RESP" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' > issues.txt || true
          echo "count=$(wc -l < issues.txt)" >> $GITHUB_OUTPUT

      - name: Set Status to PR review on linked issue items
        if: steps.proj.outputs.project_found == 'true' && steps.issues.outputs.count != '0'
        run: |
          OWNER='${{ github.repository_owner }}'
          REPO='${{ github.event.repository.name }}'
          while read N; do
            [ -z "$N" ] && continue
            Q='query($owner:String!,$repo:String!,$num:Int!){repository(owner:$owner,name:$repo){issue(number:$num){projectItems(first:50){nodes{id project{number}}}}}}'
            R=$(gh api graphql -f query="$Q" -F owner="$OWNER" -F repo="$REPO" -F num="$N")
            echo "$R" | jq -r --arg pn "${PROJECT_NUMBER}" '.data.repository.issue.projectItems.nodes[] | select(.project.number == ($pn|tonumber)) | .id' | while read ITEM; do
              [ -z "$ITEM" ] && continue
              MID='mutation($project:ID!,$item:ID!,$field:ID!,$opt:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$opt}}){clientMutationId}}'
              gh api graphql -f query="$MID" \
                -F project='${{ steps.proj.outputs.project_id }}' \
                -F item="$ITEM" \
                -F field='${{ steps.proj.outputs.status_field_id }}' \
                -F opt='${{ steps.proj.outputs.status_option_id }}'
            done
          done < issues.txt


